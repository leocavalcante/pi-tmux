name: Bug report
description: Report a problem you can reproduce with pi-tmux.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy:** Do not include credentials, tokens, prompts, conversation history or content, private window/session titles, attachments, project files, raw logs, or screenshots that show them. Sensitive-text screening is best-effort, not comprehensive; scrub logs before sharing. Use generated or redacted examples, and keep them synthetic. To report a vulnerability, use the private form in [SECURITY.md](https://github.com/leocavalcante/pi-tmux/security/advisories/new) instead.
  - type: input
    id: extension-version
    attributes:
      label: pi-tmux version
      description: Shown by `pi list`, with where it came from (npm, GitHub, or a local checkout). Enter `unknown` if unavailable.
      placeholder: 0.1.8 from npm
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: Pi version
      description: Run `pi --version`. Enter `unknown` if unavailable.
      placeholder: 1.5.2
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Run `node --version`; enter `unknown` if unavailable.
      placeholder: v22.19.0
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - WSL
        - Other
    validations:
      required: true
  - type: input
    id: tmux-version
    attributes:
      label: tmux version
      description: Run `tmux -V`; enter `unknown` if unavailable.
      placeholder: tmux 3.7c
    validations:
      required: true
  - type: dropdown
    id: ai-naming
    attributes:
      label: AI naming mode
      description: Do not include the configured provider/model or any credentials.
      options:
        - Enabled
        - Disabled with PI_TMUX_MODEL=off
        - Invalid configuration
        - Not sure
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic or redacted text. Do not paste real prompts, task titles, session history, model output, or logs.
      placeholder: |
        1. Start Pi in a tmux pane.
        2. Run a command with generated example text.
        3. Observe the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
      description: Describe the behavior without including private titles or conversation content.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Share only sanitized details that help reproduce the issue. Do not attach unsanitized logs, transcripts, or screenshots.

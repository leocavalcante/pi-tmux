name: Feature request
description: Suggest an improvement to pi-tmux.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy:** Do not include credentials, tokens, prompts, conversation history or content, private window/session titles, attachments, project files, raw logs, or screenshots that show them. Sensitive-text screening is best-effort, not comprehensive; scrub logs before sharing. Use generated or redacted examples, and keep them synthetic. To report a vulnerability, use the private form in [SECURITY.md](https://github.com/leocavalcante/pi-tmux/security/advisories/new) instead.
  - type: input
    id: extension-version
    attributes:
      label: pi-tmux version
      description: Shown by `pi list`, if available. Enter `unknown` if unavailable.
      placeholder: 0.0.0-development
  - type: input
    id: pi-version
    attributes:
      label: Pi version
      description: Run `pi --version`, if available. Enter `unknown` if unavailable.
      placeholder: 1.5.2
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Run `node --version`, if available. Enter `unknown` if unavailable.
      placeholder: v22.19.0
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - WSL
        - Other
        - Not applicable
  - type: input
    id: tmux-version
    attributes:
      label: tmux version
      description: Run `tmux -V`, if relevant. Enter `not used` if this request does not involve tmux.
      placeholder: tmux 3.7c
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe what you need and why, without private content.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Describe the change from a user's point of view. Synthetic examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Optional. Workarounds or other approaches you've tried.
